<html lang="en">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OMN Sealed — Flesh & Blood Omens</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0c12;
    --surface: #111420;
    --surface2: #171b2a;
    --border: #252a40;
    --accent: #5b8dff;
    --accent2: #ff6b35;
    --mythic: #e03030;
    --rare: #3a7fff;
    --common: #e8e8e8;
    --text: #c8d0e8;
    --text-dim: #586080;
    --deck-glow: rgba(91,141,255,0.15);
    --inv-glow: rgba(255,107,53,0.08);
    --card-aspect: 88 / 63; /* ~portrait */
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Mono', monospace;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* HEADER */
  body {
    display: flex;
    justify-content: center;
  }

  #app {
    width: 100%;
    max-width: 1000px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    border-left: 1px solid var(--border);
    border-right: 1px solid var(--border);
    box-shadow: 0 0 60px rgba(0,0,0,0.6);
  }

  header {
    display: flex;
    display: flex;
    flex-direction: column;
    padding: 10px 24px 8px;
    background: linear-gradient(180deg, #0d1020 0%, transparent 100%);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(12px);
    gap: 6px;
  }

  .logo {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.08em;
    color: #ffffff;
    text-transform: uppercase;
  }
  .logo span { color: #ffffff; }

  .header-stats {
    display: flex;
    gap: 10px;
    align-items: center;
  }
  .header-stats .btn-open {
    margin-left: auto;
  }

  .stat-pill {
    font-size: 10px;
    letter-spacing: 0.05em;
    display: flex;
    align-items: center;
    gap: 5px;
    color: var(--text-dim);
  }
  .stat-pill .num {
    font-weight: 500;
    font-size: 11px;
  }
  .stat-pill.deck .num { color: var(--accent); }
  .stat-pill.inv .num { color: var(--accent2); }
  #deckCount { color: var(--accent); }
  #deckCount.over { color: #ff4545; }

  .btn-open {
    background: var(--accent);
    border: 1px solid #7aaaff;
    border-radius: 6px;
    color: #fff;
    cursor: pointer;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.5px;
    padding: 9px 18px;
    transition: all 0.15s;
  }
  .btn-open:hover { opacity: 0.9; transform: translateY(-1px); }
  .btn-open:active { transform: translateY(0); }
  .btn-open:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  /* ZONES */
  .zones-wrap {
    display: flex;
    flex-direction: column;
    flex: 1;
    min-height: 0;
  }

  .zone-wrap {
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .zone-deck-wrap {
    flex: 0 0 auto;
  }
  .zone-inv-wrap {
    flex: 1;
    min-height: 0;
  }
  .zone-wrap.collapsed { flex: 0 0 auto; }

  .zone-deck-wrap .zone { overflow: visible; }
  .zone-inv-wrap .zone {
    height: 100%;
    overflow-y: auto;
  }

  .zone-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 16px;
    cursor: pointer;
    user-select: none;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    background: var(--surface);
  }
  .zone-deck-wrap .zone-header { border-top: none; }
  .zone-inv-wrap .zone-header { border-top: 2px solid var(--border); }

  .zone-header:hover { background: var(--surface2); }

  .zone-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    flex-shrink: 0;
  }
  .zone-deck-wrap .zone-label { color: var(--accent); }
  .zone-inv-wrap .zone-label { color: var(--accent2); }

  .zone-chevron {
    margin-left: auto;
    flex-shrink: 0;
    width: 14px;
    height: 14px;
    transition: transform 0.25s ease;
    opacity: 0.5;
  }
  .zone-wrap.collapsed .zone-chevron { transform: rotate(-90deg); }

  /* color pip breakdown */
  .color-breakdown {
    display: flex;
    align-items: center;
    gap: 8px;
    flex: 1;
    min-width: 0;
  }
  .color-pip {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.04em;
    opacity: 0.85;
  }
  .color-pip .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .color-pip.red .dot  { background: #e05050; box-shadow: 0 0 4px #e05050aa; }
  .color-pip.yellow .dot { background: #d4a017; box-shadow: 0 0 4px #d4a017aa; }
  .color-pip.blue .dot  { background: #4a9edd; box-shadow: 0 0 4px #4a9eddaa; }
  .color-pip.red   { color: #e07070; }
  .color-pip.yellow { color: #c8962a; }
  .color-pip.blue  { color: #6ab4e8; }

  .zone {
    padding: 12px 16px;
    position: relative;
    transition: background 0.3s;
  }
  .zone-wrap.collapsed .zone { display: none; }

  .zone-deck {
    background: radial-gradient(ellipse at top, rgba(91,141,255,0.06) 0%, transparent 70%);
  }

  .zone-inv {
    background: radial-gradient(ellipse at bottom, rgba(255,107,53,0.05) 0%, transparent 70%);
  }

  /* CARD GRID */
  .card-grid {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    gap: 6px;
  }

  @media (max-width: 600px) {
    .card-grid { grid-template-columns: repeat(4, 1fr); }
  }

  .card-slot {
    position: relative;
    aspect-ratio: 63 / 88;
    border-radius: 5px;
    overflow: visible;
    cursor: pointer;
    transition: transform 0.15s, filter 0.15s;
  }

  .card-slot:hover {
    transform: translateY(-4px) scale(1.03);
    z-index: 10;
  }

  .card-slot img {
    width: 100%;
    height: 100%;
    border-radius: 5px;
    display: block;
    object-fit: cover;
    pointer-events: none;
    border: 1px solid rgba(255,255,255,0.05);
    transition: border-color 0.15s;
  }

  .card-slot:hover img {
    border-color: rgba(255,255,255,0.2);
  }

  /* Rarity ring */
  .card-slot::before {
    content: '';
    position: absolute;
    inset: -1px;
    border-radius: 6px;
    pointer-events: none;
    z-index: 1;
    opacity: 0;
    transition: opacity 0.2s;
  }
  .card-slot:hover::before { opacity: 1; }
  .card-slot.mythic::before { box-shadow: 0 0 10px 1px var(--mythic); border: 1px solid var(--mythic); }
  .card-slot.rare::before { box-shadow: 0 0 8px 1px var(--rare); border: 1px solid var(--rare); }
  .card-slot.common::before { box-shadow: 0 0 6px 1px rgba(232,232,232,0.4); border: 1px solid var(--common); }

  /* EYE icon — removed */

  /* EMPTY STATE */
  .empty-zone {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 120px;
    color: var(--text-dim);
    font-size: 10px;
    letter-spacing: 1px;
    border: 2px dashed var(--border);
    border-radius: 8px;
    text-align: center;
    padding: 20px;
  }

  /* PACK OPEN ANIMATION */
  @keyframes packReveal {
    0% { opacity: 0; transform: translateY(8px) scale(0.95); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }
  .card-slot.new {
    animation: packReveal 0.3s ease forwards;
  }

  /* scrollbar */
  .zone::-webkit-scrollbar { width: 4px; }
  .zone::-webkit-scrollbar-track { background: transparent; }
  .zone::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  /* Rarity dot */
  .rarity-dot {
    position: absolute;
    bottom: 4px;
    right: 5px;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    border: 1px solid rgba(0,0,0,0.5);
    z-index: 5;
    pointer-events: none;
  }
  .rarity-dot.mythic { background: var(--mythic); box-shadow: 0 0 4px var(--mythic); }
  .rarity-dot.rare { background: var(--rare); box-shadow: 0 0 4px var(--rare); }
  .rarity-dot.common { background: var(--common); box-shadow: 0 0 3px rgba(232,232,232,0.5); }

  /* Overflow warning */
  .over-limit {
    background: rgba(255,69,69,0.1);
    border: 1px solid rgba(255,69,69,0.3);
    border-radius: 6px;
    color: #ff8585;
    font-size: 10px;
    letter-spacing: 0.5px;
    margin-bottom: 8px;
    padding: 5px 10px;
    display: none;
  }
  .over-limit.show { display: block; }
</style>
</head>

<div id="app">

<header>
  <div class="logo">Flesh &amp; Blood <span>// Omens</span> — Sealed</div>
  <div class="header-stats">
    <div class="stat-pill deck">
      Deck: <span class="num" id="deckCount">0</span> / 30
    </div>
    <div class="stat-pill inv">
      Pool: <span class="num" id="invCount">0</span>
    </div>
    <button class="btn-open" id="openBtn" onclick="openPacks()">Open 8 packs</button>
  </div>
</header>

<div class="zones-wrap">
  <div class="zone-wrap zone-deck-wrap" id="deckWrap">
    <div class="zone-header" onclick="toggleZone('deck')">
      <span class="zone-label">Deck</span>
      <div class="color-breakdown" id="colorBreakdown"></div>
      <svg class="zone-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="zone zone-deck">
      <div class="over-limit" id="overLimit">Deck exceeds 30 cards — please remove some cards</div>
      <div class="card-grid" id="deckGrid">
        <div class="empty-zone" style="grid-column:1/-1">
          Click cards from Inventory to add them to your Deck
        </div>
      </div>
    </div>
  </div>
  <div class="zone-wrap zone-inv-wrap" id="invWrap">
    <div class="zone-header" onclick="toggleZone('inv')">
      <span class="zone-label">Inventory</span>
      <svg class="zone-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="zone zone-inv">
      <div class="card-grid" id="invGrid">
        <div class="empty-zone" style="grid-column:1/-1">
          Open packs to see your card pool
        </div>
      </div>
    </div>
  </div>
</div>

</div><!-- /#app -->

    {pool:"Generic",count:1},{pool:"Equipment",count:1},
    {pool:"rare",count:1},{pool:"Mythic",count:1},{pool:"RFMythic",count:1}
  ]},
  { weight: 40000, slots: [
    {pool:"LightningIllusionist",count:2},{pool:"LightningRuneblade",count:1},
    {pool:"LightningWizard",count:3},{pool:"Lightning",count:3},
    {pool:"Generic",count:1},{pool:"Equipment",count:1},
    {pool:"Mythic",count:2},{pool:"RFCommon",count:1}
  ]},
  { weight: 7000, slots: [
    {pool:"LightningIllusionist",count:2},{pool:"LightningRuneblade",count:1},
    {pool:"LightningWizard",count:3},{pool:"Lightning",count:3},
    {pool:"Generic",count:1},{pool:"Equipment",count:1},
    {pool:"Mythic",count:2},{pool:"RFRare",count:1}
  ]},
  { weight: 1400, slots: [
    {pool:"LightningIllusionist",count:2},{pool:"LightningRuneblade",count:1},
    {pool:"LightningWizard",count:3},{pool:"Lightning",count:3},
    {pool:"Generic",count:1},{pool:"Equipment",count:1},
    {pool:"Mythic",count:2},{pool:"RFMythic",count:1}
  ]},
];

const TOTAL_WEIGHT = PACK_LAYOUTS.reduce((s, l) => s + l.weight, 0);

function pickLayout() {
  let r = Math.random() * TOTAL_WEIGHT;
  for (const layout of PACK_LAYOUTS) {
    r -= layout.weight;
    if (r <= 0) return layout;
  }
  return PACK_LAYOUTS[0];
}

function rnd(pool) {
  return pool[Math.floor(Math.random() * pool.length)];
}

function openOnePack() {
  const layout = pickLayout();
  const cards = [];
  for (const slot of layout.slots) {
    for (let i = 0; i < slot.count; i++) {
      cards.push(rnd(POOLS[slot.pool]));
    }
  }
  return cards;
}

// ===================== SORTING =====================
const CATEGORY_ORDER = [
  "Equipment", "Generic", "Lightning", "LightningRuneblade", "Runeblade",
  "LightningWizard", "Wizard", "LightningIllusionist", "Illusionist"
];
const COLOR_ORDER = { red: 0, yellow: 1, blue: 2, none: 3 };

function getCategory(name) {
  const data = CARDS[name];
  if (!data) return "Generic";
  const t = data.type;
  if (t.includes("Equipment")) return "Equipment";
  if (t.includes("Illusionist") && t.includes("Lightning")) return "LightningIllusionist";
  if (t.includes("Illusionist")) return "Illusionist";
  if (t.includes("Runeblade") && t.includes("Lightning")) return "LightningRuneblade";
  if (t.includes("Runeblade")) return "Runeblade";
  if (t.includes("Wizard") && t.includes("Lightning")) return "LightningWizard";
  if (t.includes("Wizard")) return "Wizard";
  if (t.includes("Lightning")) return "Lightning";
  return "Generic";
}

function getColor(name) {
  const m = name.match(/\((red|yellow|blue)\)$/i);
  return m ? m[1].toLowerCase() : "none";
}

function sortCards(cards) {
  return [...cards].sort((a, b) => {
    const catA = CATEGORY_ORDER.indexOf(getCategory(a.name));
    const catB = CATEGORY_ORDER.indexOf(getCategory(b.name));
    if (catA !== catB) return catA - catB;
    const colA = COLOR_ORDER[getColor(a.name)] ?? 3;
    const colB = COLOR_ORDER[getColor(b.name)] ?? 3;
    if (colA !== colB) return colA - colB;
    return a.name.localeCompare(b.name);
  });
}

// ===================== STATE =====================
let inventory = []; // array of {name, uid}
let deck = [];      // array of {name, uid}
let uidCounter = 0;

function uid() { return ++uidCounter; }

// ===================== COLLAPSE =====================
const collapseState = { deck: false, inv: false };

function toggleZone(zone) {
  collapseState[zone] = !collapseState[zone];
  document.getElementById(zone === 'deck' ? 'deckWrap' : 'invWrap')
    .classList.toggle('collapsed', collapseState[zone]);
}

// ===================== RENDER =====================
function colorBreakdownHTML(cards) {
  const counts = { red: 0, yellow: 0, blue: 0 };
  for (const c of cards) {
    const col = getColor(c.name);
    if (col in counts) counts[col]++;
  }
  const total = counts.red + counts.yellow + counts.blue;
  if (total === 0) return '';
  return ['red','yellow','blue'].map(col =>
    counts[col] > 0
      ? `<span class="color-pip ${col}"><span class="dot"></span>${counts[col]}</span>`
      : ''
  ).join('');
}

function cardHTML(card, zone) {
  const data = CARDS[card.name];
  if (!data) return '';
  const img = imgUrl(data.num);
  const r = data.rarity;
  return `
    <div class="card-slot ${r}" data-uid="${card.uid}" data-zone="${zone}" data-name="${card.name.replace(/'/g,"&#39;")}"
         onclick="handleCardClick(event,${card.uid},'${zone}')">
      <img src="${img}" alt="${card.name}" loading="lazy"
           onerror="this.src='https://d2h5owxb2ypf43.cloudfront.net/cards/cardback.webp'">
      <div class="rarity-dot ${r}"></div>
    </div>`;
}

function render() {
  const deckGrid = document.getElementById('deckGrid');
  const invGrid = document.getElementById('invGrid');
  const deckCount = document.getElementById('deckCount');
  const invCount = document.getElementById('invCount');
  const overLimit = document.getElementById('overLimit');
  const colorBreakdown = document.getElementById('colorBreakdown');

  if (deck.length === 0) {
    deckGrid.innerHTML = '<div class="empty-zone" style="grid-column:1/-1">Click cards from Inventory to add them to your Deck</div>';
  } else {
    deckGrid.innerHTML = sortCards(deck).map(c => cardHTML(c, 'deck')).join('');
  }

  if (inventory.length === 0 && deck.length === 0) {
    invGrid.innerHTML = '<div class="empty-zone" style="grid-column:1/-1">Open packs to see your card pool</div>';
  } else {
    invGrid.innerHTML = sortCards(inventory).map(c => cardHTML(c, 'inv')).join('');
  }

  deckCount.textContent = deck.length;
  deckCount.classList.toggle('over', deck.length > 30);
  overLimit.classList.toggle('show', deck.length > 30);
  invCount.textContent = inventory.length;
  colorBreakdown.innerHTML = colorBreakdownHTML(deck);
}

// ===================== ACTIONS =====================
function moveCard(cardUid, fromZone) {
  if (fromZone === 'inv') {
    const idx = inventory.findIndex(c => c.uid === cardUid);
    if (idx === -1) return;
    const card = inventory.splice(idx, 1)[0];
    deck.push(card);
  } else {
    const idx = deck.findIndex(c => c.uid === cardUid);
    if (idx === -1) return;
    const card = deck.splice(idx, 1)[0];
    inventory.push(card);
  }
  render();
}

function openPacks() {
  document.getElementById('openBtn').disabled = true;
  const allCards = [];
  for (let i = 0; i < 8; i++) {
    const pack = openOnePack();
    pack.forEach(name => allCards.push({ name, uid: uid() }));
  }
  inventory = allCards;
  deck = [];
  render();
  // animate
  setTimeout(() => {
    document.querySelectorAll('.card-slot').forEach((el, i) => {
      el.style.animationDelay = `${i * 18}ms`;
      el.classList.add('new');
    });
  }, 10);
}

// ===================== PREVIEW =====================
const preview = document.getElementById('cardPreview');
const previewImg = document.getElementById('previewImg');
const PREVIEW_W = 220;
const PREVIEW_H = 308;
const DELAY = 500;

let hoverTimer = null;
let pressTimer = null;
let pressTriggered = false; // true = preview shown, suppress move on release

function showPreview(name, anchorEl) {
  const data = CARDS[name];
  if (!data) return;
  previewImg.src = imgUrl(data.num);
  previewImg.onerror = () => { previewImg.src = 'https://d2h5owxb2ypf43.cloudfront.net/cards/cardback.webp'; };

  const rect = anchorEl.getBoundingClientRect();
  const vw = window.innerWidth;
  const vh = window.innerHeight;

  let left = rect.right + 10;
  if (left + PREVIEW_W > vw - 8) left = rect.left - PREVIEW_W - 10;
  let top = rect.top + (rect.height / 2) - (PREVIEW_H / 2);
  top = Math.max(8, Math.min(top, vh - PREVIEW_H - 8));

  preview.style.left = left + 'px';
  preview.style.top  = top  + 'px';
  preview.classList.add('visible');
}

function hidePreview() {
  preview.classList.remove('visible');
}

preview.addEventListener('click', () => {
  clearTimeout(hoverTimer);
  hidePreview();
});

// ---- MOUSE: show after 0.5s hover, hide on leave ----
document.addEventListener('mouseover', e => {
  const slot = e.target.closest('.card-slot');
  if (!slot) return;
  clearTimeout(hoverTimer);
  hoverTimer = setTimeout(() => showPreview(slot.dataset.name, slot), DELAY);
});

document.addEventListener('mouseout', e => {
  const slot = e.target.closest('.card-slot');
  if (!slot) return;
  if (slot.contains(e.relatedTarget)) return;
  clearTimeout(hoverTimer);
  hidePreview();
});

// ---- MOUSE CLICK: only fires if mouse was held < 0.5s (preview not shown) ----
function handleCardClick(e, cardUid, zone) {
  // If preview is currently visible the user held long enough — don't move
  if (preview.classList.contains('visible')) return;
  moveCard(cardUid, zone);
}

// ---- TOUCH: always move on tap, no preview ----
document.addEventListener('touchend', e => {
  const slot = e.target.closest('.card-slot');
  if (!slot) return;
  // Let the synthetic click fire → handleCardClick → moveCard
}, { passive: true });

document.addEventListener('touchmove', () => {
  // nothing needed
}, { passive: true });

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { clearTimeout(hoverTimer); hidePreview(); }
});
</script>
