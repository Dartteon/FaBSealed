<svg width="100%" viewBox="0 0 680 300" role="img" xmlns="http://www.w3.org/2000/svg" style="">
<title style="fill:rgb(0, 0, 0);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">OMN Favicon v3 — three lightning bolts with purple mist</title>
<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Circular favicon with dark background, purple mist, and three classic lightning bolt shapes in light blue.</desc>

<defs>
  <radialGradient id="bgc" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#0a0820"/>
    <stop offset="70%" stop-color="#060515"/>
    <stop offset="100%" stop-color="#030310"/>
  </radialGradient>
  <radialGradient id="mist1" cx="38%" cy="32%" r="55%">
