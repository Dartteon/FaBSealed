    <stop offset="88%" stop-color="#5588cc" stop-opacity="0.4"/>
    <stop offset="93%" stop-color="#aaddff" stop-opacity="0.9"/>
    <stop offset="100%" stop-color="#4466aa" stop-opacity="0.3"/>
  </radialGradient>
