    <stop offset="100%" stop-color="#2288cc"/>
  </linearGradient>
  <radialGradient id="glowC" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#55ccff" stop-opacity="0.55"/>
    <stop offset="100%" stop-color="#55ccff" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="rim" cx="50%" cy="50%" r="50%">
