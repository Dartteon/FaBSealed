<svg width="100%" viewBox="0 0 680 680" role="img" xmlns="http://www.w3.org/2000/svg" style="">
<title style="fill:rgb(0, 0, 0);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Omens favicon — smaller O with protruding lightning bolt</title>
<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">A smaller O letterform in icy blue with a tall lightning bolt protruding above and below the ring, transparent background.</desc>
<defs>
  <linearGradient id="oGrad" x1="20%" y1="0%" x2="80%" y2="100%">
    <stop offset="0%" stop-color="#e8f9ff"/>
    <stop offset="35%" stop-color="#7dd8f8"/>
    <stop offset="100%" stop-color="#2299cc"/>
  </linearGradient>
  <linearGradient id="bGrad" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#f5fcff"/>
    <stop offset="40%" stop-color="#88e0ff"/>
    <stop offset="100%" stop-color="#1a88bb"/>
  </linearGradient>
</defs>

<!-- Outer black outline -->
<circle cx="340" cy="340" r="182" fill="none" stroke="#000" stroke-width="10" style="fill:none;stroke:rgb(0, 0, 0);color:rgb(255, 255, 255);stroke-width:10px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
<!-- Inner black outline -->
<circle cx="340" cy="340" r="118" fill="none" stroke="#000" stroke-width="10" style="fill:none;stroke:rgb(0, 0, 0);color:rgb(255, 255, 255);stroke-width:10px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

<!-- O ring -->
<circle cx="340" cy="340" r="150" fill="none" stroke="url(#oGrad)" stroke-width="60" style="fill:none;color:rgb(255, 255, 255);stroke-width:60px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

<!-- Black outline for bolt (behind) -->
<polygon points="326,40 372,40 346,260 402,260 348,640 296,640 374,300 318,300" fill="#000" stroke="#000" stroke-width="14" stroke-linejoin="round" style="fill:rgb(0, 0, 0);stroke:rgb(0, 0, 0);color:rgb(255, 255, 255);stroke-width:14px;stroke-linecap:butt;stroke-linejoin:round;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

<!-- Bolt fill -->
<polygon points="326,40 372,40 346,260 402,260 348,640 296,640 374,300 318,300" fill="url(#bGrad)" style="stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

<!-- Shine -->
<polygon points="326,40 352,40 330,220 350,220 346,260 360,260 318,300 328,180" fill="#fff" opacity="0.25" style="fill:rgb(255, 255, 255);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.25;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

</svg>